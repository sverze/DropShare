#This configuration is pre-filled with the default values.
#You can remove keys you don't want to set. If a key is missing, the value set in the UI will be used; if that is also unset, the default value applies.

general:
  requestLogRetentionDays: "30"
  #Name of the application
  appName: DropShare
  #On which URL this service is available
  appUrl: http://localhost:3000
  #Whether to set the secure flag on cookies. If enabled, the site will not function when accessed over HTTP.
  secureCookies: "false"
  #Whether to show the home page
  showHomePage: "true"
  #Time after which a user must log in again (default: 3 months).
  sessionDuration: 3 months
  themeDarkAccent: "#fb923c"
  themeDarkBackground: "#140b04"
  themeDarkHeaderBackground: "#261a0f"
  themeDarkHeaderBorder: "#fb923c"
  themeDarkLogoText: "#ffffff"
  themeDarkLogoAccent: "#fb923c"
  themeDarkUploadButton: "#fb923c"
  themeDarkBulkUploadButton: "#fbbf24"
  themeDarkHomeButton: "#fb923c"
  themeDarkPanelBackground: "#241a0f"
  themeDarkPanelBorder: "#fb923c"
  themeLightAccent: "#ea580c"
  themeLightBackground: "#fff7ed"
  themeLightHeaderBackground: "#ffefdd"
  themeLightHeaderBorder: "#ea580c"
  themeLightLogoText: "#2a1c10"
  themeLightLogoAccent: "#ea580c"
  themeLightUploadButton: "#ea580c"
  themeLightBulkUploadButton: "#d97706"
  themeLightHomeButton: "#ea580c"
  themeLightPanelBackground: "#ffffff"
  themeLightPanelBorder: "#ea580c"
  themeModalRingOuter: "#f97316"
  themeModalRingInner: "#f59e0b"
  themeModalRingCenter: "#fdba74"
  themeHeaderStyle: default
  themeLogoIsOpaque: "false"
  themeLogoVersion: "1"
  themeSharePresets: '[{"color":"#00ff5a","name":"Neon
    Green"},{"color":"#00d4ff","name":"Electric
    Blue"},{"color":"#ff6b35","name":"Sunset
    Orange"},{"color":"#a855f7","name":"Purple
    Haze"},{"color":"#ff1493","name":"Hot
    Pink"},{"color":"#fbbf24","name":"Golden"},{"color":"#22d3d6","name":"Cyan"},{"color":"#ef4444","name":"Red
    Alert"},{"color":"#a9b0ca","name":"Space Grey"}]'
banners:
  items: "[]"
access:
  managerCapabilities: "{}"
share:
  virusScanEnabled: "true"
  #Whether registration is allowed
  allowRegistration: "true"
  #Whether a valid invite code is required before a public user can create an account.
  requireInviteCodeForRegistration: "false"
  #Whether unauthenticated users can create shares
  allowUnauthenticatedShares: "false"
  #Visibility given to newly created shares. "public" means anyone with the link can view and download without an account; "private" limits it to the creator, the share's group and admins. Existing shares are never changed by this.
  defaultShareVisibility: public
  allowUninvitedRegisteredShares: "false"
  maxAnonymousExpiration: 5 days
  maxUninvitedRegisteredExpiration: 5 days
  maxUninvitedRegisteredSize: "1073741824"
  #Maximum share expiration. Set to 0 to allow unlimited expiration.
  maxExpiration: 0 days
  #Default length for the generated ID of a share. This value is also used to generate links for reverse shares. A value below 8 is not considered secure.
  shareIdLength: "15"
  #Maximum total share size for signed-in accounts.
  maxSize: "12000000000"
  #Maximum total share size for visitors who are not signed in.
  maxAnonymousSize: "7000000000"
  #Adjust the level to balance between file size and compression speed. Valid values range from 0 to 9, with 0 being no compression and 9 being maximum compression. 
  zipCompressionLevel: "9"
  #Controls the part size used for multipart uploads. Smaller parts improve reliability on unstable connections, while larger parts reduce request overhead on stable connections. Minimum: 5 MB.
  chunkSize: "10000000"
  #Files larger than this size will use multipart uploads instead of a regular direct upload. Minimum: 5 MB.
  multipartThreshold: "50000000"
  #The share creation modal automatically appears when a user selects files, eliminating the need to manually click the button.
  autoOpenShareModal: "false"
  bulkUploadMode: page
  #Reverse shares let a user send someone a link to upload files back to them. When disabled, the option is hidden from the account menu and no new reverse shares can be created. Links that already exist keep working.
  allowReverseShares: "true"
donations:
  enabled: "false"
  provider: btcpay
  storageCostPerGibMonthUsd: "0.0198"
  serverCostPerMonthUsd: "100"
  btcAddress: ""
  externalUrl: ""
  externalLabel: Donate via PayPal
  btcpayServerUrl: ""
  btcpayStoreId: ""
  btcpayApiKey: ""
  btcpayWebhookSecret: ""
  btcpayInvoiceExpirationMinutes: "30"
  note: Donations help cover storage and bandwidth for your group. They are
    optional and never required to keep using DropShare.
cache:
  #Normally the app caches information in memory. If you run multiple instances, you need to enable Redis caching to share the cache between the instances.
  redis-enabled: "false"
  #Url to connect to the Redis instance used for caching.
  redis-url: redis://dropshare-redis:6379
  #Time in second to keep information inside the cache.
  ttl: "60"
  #Maximum number of items inside the cache.
  maxItems: "1000"
email:
  loginVerification: "true"
  #Whether to allow email sharing with recipients. Only enable this if SMTP is activated.
  enableShareEmailRecipients: "false"
  #Subject of the email which gets sent to the share recipients.
  shareRecipientsSubject: Files shared with you
  #Message which gets sent to the share recipients. Available variables:
  # {creator} - The username of the creator of the share
  # {creatorEmail} - The email of the creator of the share
  # {shareUrl} - The URL of the share
  # {desc} - The description of the share
  # {expires} - The expiration date of the share
  # These variables will be replaced with the actual value.
  shareRecipientsMessage: >-
    Hey!


    {creator} ({creatorEmail}) shared some files with you. You can view or
    download the files with this link: {shareUrl}


    The share will expire {expires}.


    Note: {desc}


    Shared securely with DropShare
  #Subject of the sent email when someone created a share with your reverse share link.
  reverseShareSubject: Reverse share link used
  #Message which gets sent when someone created a share with your reverse share link. {shareUrl} will be replaced with the creator's name and the share URL.
  reverseShareMessage: |-
    Hey!

    A share was just created with your reverse share link: {shareUrl}

    Shared securely with DropShare
  #Subject of the sent email when a user requests a password reset.
  resetPasswordSubject: DropShare password reset
  #Message which gets sent when a user requests a password reset. {url} will be replaced with the reset password URL.
  resetPasswordMessage: >-
    Hey!


    You requested a password reset. Click this link to reset your password:
    {url}

    The link expires in an hour.


    DropShare
  #Subject of the sent email when an admin invites a user.
  inviteSubject: DropShare invite
  #Message which gets sent when an admin invites a user. {url} will be replaced with the invite URL, {email} with the email and {password} with the users password.
  inviteMessage: |-
    Hey!

    You were invited to DropShare. Click this link to accept the invite: {url}

    You can use the email "{email}" and the password "{password}" to sign in.

    DropShare
smtp:
  #Whether SMTP is enabled. Only set this to true if you entered the host, port, email, user and password of your SMTP server.
  enabled: "false"
  #Only set this to true if you need to trust self signed certificates.
  allowUnauthorizedCertificates: "false"
  #Host of the SMTP server
  host: ""
  #Port of the SMTP server
  port: "0"
  #Email address from which the emails get sent
  email: ""
  #Username of the SMTP server
  username: ""
  #Password of the SMTP server
  password: ""
ldap:
  #Use LDAP authentication for user login
  enabled: "false"
  #URL of the LDAP server
  url: ""
  #Default user used to perform the user search
  bindDn: ""
  #Password used to perform the user search
  bindPassword: ""
  #Base location, where the user search will be performed
  searchBase: ""
  #The user query will be used to search the 'User base' for the LDAP user. %username% can be used as the placeholder for the user given input.
  searchQuery: ""
  #Group required for administrative access.
  adminGroups: ""
  #LDAP attribute name for the groups, an user is a member of. This is used when checking for the admin group.
  fieldNameMemberOf: memberOf
  #LDAP attribute name for the email of an user.
  fieldNameEmail: userPrincipalName
oauth:
  #Allow users to register via social login
  allowRegistration: "true"
  #Whether to ignore TOTP when user using social login
  ignoreTotp: "true"
  #Whether to disable password login
  #Make sure that an OAuth provider is properly configured before activating this configuration to avoid being locked out.
  disablePassword: "false"
  #Whether GitHub login is enabled
  github-enabled: "false"
  #Client ID of the GitHub OAuth app
  github-clientId: ""
  #Client secret of the GitHub OAuth app
  github-clientSecret: ""
  #Whether Google login is enabled
  google-enabled: "false"
  #Client ID of the Google OAuth app
  google-clientId: ""
  #Client secret of the Google OAuth app
  google-clientSecret: ""
  #Whether Microsoft login is enabled
  microsoft-enabled: "false"
  #Tenant ID of the Microsoft OAuth app
  #common: Users with both a personal Microsoft account and a work or school account from Microsoft Entra ID can sign in to the application. organizations: Only users with work or school accounts from Microsoft Entra ID can sign in to the application.
  #consumers: Only users with a personal Microsoft account can sign in to the application.
  #domain name of the Microsoft Entra tenant or the tenant ID in GUID format: Only users from a specific Microsoft Entra tenant (directory members with a work or school account or directory guests with a personal Microsoft account) can sign in to the application.
  microsoft-tenant: common
  #Client ID of the Microsoft OAuth app
  microsoft-clientId: ""
  #Client secret of the Microsoft OAuth app
  microsoft-clientSecret: ""
  #Whether Discord login is enabled
  discord-enabled: "false"
  #Limit signing in to users in a specific server. Leave it blank to disable.
  discord-limitedGuild: ""
  #Limit signing in to specific users by their Discord ID. Leave it blank to disable.
  discord-limitedUsers: ""
  #Client ID of the Discord OAuth app
  discord-clientId: ""
  #Client secret of the Discord OAuth app
  discord-clientSecret: ""
  #Whether OpenID Connect login is enabled
  oidc-enabled: "false"
  #Discovery URI of the OpenID Connect OAuth app
  oidc-discoveryUri: ""
  #Whether the “Sign out” button will sign out from the OpenID Connect provider
  oidc-signOut: "false"
  #Scopes which should be requested from the OpenID Connect provider.
  oidc-scope: openid email profile
  #Username claim in OpenID Connect ID token. Leave it blank if you don't know what this config is.
  oidc-usernameClaim: ""
  #Must be a valid JMES path referencing an array of roles. Managing access rights using OpenID Connect roles is only recommended if no other identity provider is configured and password login is disabled. Leave it blank if you don't know what this config is.
  oidc-rolePath: ""
  #Role required for general access. Must be present in a user’s roles for them to log in. Leave it blank if you don't know what this config is.
  oidc-roleGeneralAccess: ""
  #Role required for administrative access. Must be present in a user’s roles for them to access the admin panel. Leave it blank if you don't know what this config is.
  oidc-roleAdminAccess: ""
  #Client ID of the OpenID Connect OAuth app
  oidc-clientId: ""
  #Client secret of the OpenID Connect OAuth app
  oidc-clientSecret: ""
s3:
  #Whether S3 should be used to store the shared files instead of the local file system.
  enabled: "false"
  #The URL of the S3 bucket.
  endpoint: ""
  #The region of the S3 bucket.
  region: ""
  #The name of the S3 bucket.
  bucketName: ""
  #The default path which should be used to store the files in the S3 bucket.
  bucketPath: ""
  publicUrl: ""
  #If enabled, the app may serve share files through stable public CDN URLs instead of expiring signed URLs.
  allowPublicUrlAccess: "false"
  #The key which allows you to access the S3 bucket.
  key: ""
  #The secret which allows you to access the S3 bucket.
  secret: ""
  #Turn off for backends that do not support checksum (e.g. B2).
  useChecksum: "true"
legal:
  #Whether to show the Legal button, legal pages, and footer legal links.
  enabled: "false"
  #Whether to show the Terms of Service section on the legal page.
  termsOfServiceEnabled: "true"
  #Whether to show the Privacy Policy section on the legal page and privacy link.
  privacyPolicyEnabled: "true"
  #Whether to show the DMCA & takedowns section on the legal page.
  dmcaEnabled: "true"
  #Whether to show the Contact & Reporting section on the legal page.
  contactEnabled: "true"
  supportEmail: ""
  abuseEmail: ""
  #Whether to show the imprint section on the legal page and imprint link.
  imprintEnabled: "true"
  #The text which should be shown in the imprint. Supports Markdown. Leave blank to link to an external imprint page.
  imprintText: ""
  #If you already have an imprint page you can link it here instead of using the text field.
  imprintUrl: ""
  #The text which should be shown in the privacy policy. Supports Markdown. Leave blank to link to an external privacy policy page.
  privacyPolicyText: >-
    ## 1. Information We Collect


    **Information You Provide:**


    - Account Information: Username, email address, and encrypted password (if
    you register)

    - Uploaded Files: Files you upload (stored temporarily until expiration)

    - Share Settings: Expiration dates, passwords, and other configurations


    **Information Collected Automatically:**


    - IP Addresses: Logged for security and abuse prevention

    - Device Information: Browser type, operating system

    - Usage Data: Pages visited, features used, timestamps

    - Cookies: Essential cookies for authentication and preferences


    ## 2. How We Use Your Information


    - Provide and maintain the Service

    - Process your uploads and generate share links

    - Authenticate users and secure accounts

    - Detect and prevent abuse, fraud, and illegal activity

    - Respond to legal requests and enforce our Terms

    - Improve and optimize our Service


    ## 3. Information Sharing


    We may share your information when required by law, court order, or
    government request.

    We may share information with service providers who assist in operating our
    Service.

    We do NOT sell your personal information to advertisers.


    ## 4. Data Security


    We implement appropriate security measures including encryption of data in
    transit (HTTPS/TLS),

    secure password hashing, regular security updates, and access controls.
    However, no method of

    transmission over the Internet is 100% secure.


    ## 5. Your Rights


    Depending on your jurisdiction, you may have the right to access, correct,
    delete, or port

    your personal data. To exercise these rights, contact us at the email below.


    ## 6. Children's Privacy


    Our Service is not intended for children under 13 years of age. We do not
    knowingly collect

    personal information from children under 13.
  #If you already have a privacy policy page you can link it here instead of using the text field.
  privacyPolicyUrl: ""
  #The text shown in the Legal page's Terms tab. Supports Markdown. Leave blank to keep the built-in default terms.
  termsOfServiceText: >
    ## 1. Acceptance of Terms


    By accessing or using DropShare ("Service"), you agree to be bound by these
    Terms of Service.

    If you do not agree to these Terms, do not use the Service.


    ## 2. Description of Service


    DropShare is a file-sharing platform that allows users to upload, store, and
    share files

    through private or public links. Features, limits, and availability may
    change over time.


    ## 3. Eligibility and Account Responsibility


    You may use the Service only if you are legally able to enter into these
    Terms. If you create

    an account, you are responsible for maintaining the confidentiality of your
    credentials and for

    all activity that occurs under your account.


    ## 4. Your Content and Rights


    You retain ownership of content you upload. By uploading or sharing content
    through the Service,

    you represent and warrant that:


    - You own the content or have all rights and permissions necessary to
    upload, store, and share it

    - Your content and your use of the Service do not violate any law, contract,
    or third-party right

    - You are solely responsible for the content you upload and for the links
    you distribute


    ## 5. Acceptable Use


    You may not use the Service to:


    - Upload, store, or share content that infringes copyright, trademark,
    privacy, publicity, or other rights

    - Upload, store, or distribute child sexual abuse material (CSAM) or any
    content exploiting minors

    - Upload, store, or distribute malware, malicious code, phishing material,
    or other harmful software

    - Distribute content that is unlawful, fraudulent, defamatory, harassing,
    threatening, or abusive

    - Attempt to gain unauthorized access to accounts, files, systems, or
    networks

    - Interfere with the security, stability, or proper operation of the Service

    - Use the Service in violation of applicable laws or regulations


    ## 6. Public Sharing and Availability


    Anyone with a valid share link may be able to access content made available
    through that link,

    subject to any password, expiration, or access controls you set. You are
    responsible for ensuring

    that your sharing settings match the intended audience and sensitivity of
    the content.


    ## 7. Enforcement, Removal, and Suspension


    We may investigate misuse of the Service and may remove content, disable
    links, limit access,

    suspend accounts, or terminate access at any time, with or without notice,
    including where we

    believe:


    - The content or conduct violates these Terms or applicable law

    - The content is subject to a valid complaint, takedown request, or legal
    process

    - The content or activity creates security, abuse, or operational risk for
    the Service or others


    We may preserve and disclose information where required by law or where we
    reasonably believe it

    is necessary to protect users, third parties, or the Service.


    ## 8. Copyright, Abuse, and Support


    DropShare may respond to copyright, abuse, impersonation, fraud, malware,
    and other policy

    reports. Please use the contact details published on the Legal page for
    support, abuse,

    and takedown matters.


    ## 9. Disclaimer of Warranties


    THE SERVICE IS PROVIDED "AS IS" AND "AS AVAILABLE" WITHOUT WARRANTIES OF ANY
    KIND, EXPRESS

    OR IMPLIED, INCLUDING IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A
    PARTICULAR PURPOSE,

    TITLE, AND NON-INFRINGEMENT. WE DO NOT WARRANT THAT THE SERVICE WILL BE
    UNINTERRUPTED, SECURE,

    ERROR-FREE, OR FREE FROM LOSS, CORRUPTION, OR DELAY.


    ## 10. Limitation of Liability


    TO THE MAXIMUM EXTENT PERMITTED BY LAW, DROPSHARE AND ITS OPERATORS WILL NOT
    BE LIABLE FOR ANY

    INDIRECT, INCIDENTAL, SPECIAL, CONSEQUENTIAL, EXEMPLARY, OR PUNITIVE
    DAMAGES, OR FOR ANY LOSS OF

    DATA, CONTENT, BUSINESS, REVENUE, PROFITS, OR GOODWILL ARISING OUT OF OR
    RELATED TO YOUR USE OF

    THE SERVICE.


    ## 11. Data Retention


    Files are generally deleted after their configured expiration period. We may
    retain logs,

    metadata, abuse records, and other limited operational information for
    security, fraud

    prevention, legal compliance, and service administration.


    ## 12. Changes to These Terms


    We may update these Terms from time to time. Continued use of the Service
    after revised Terms

    become effective constitutes acceptance of the updated Terms.
  #The text shown in the Legal page's DMCA tab. Supports Markdown. Leave blank to keep the built-in default DMCA notice.
  dmcaText: >-
    ## Copyright Policy


    DropShare respects the intellectual property rights of others and expects
    users to do the same.

    We may remove or disable access to material claimed to be infringing and may
    terminate repeat

    infringers in appropriate circumstances.


    ## Filing a DMCA Takedown Notice


    If you believe material on DropShare infringes your copyright, your written
    notice should include:


    1. Your physical or electronic signature

    2. Identification of the copyrighted work claimed to have been infringed

    3. Identification of the material claimed to be infringing, with information
    reasonably sufficient for us to locate it, including the full DropShare URL

    4. Your name, mailing address, telephone number, and email address

    5. A statement that you have a good-faith belief the disputed use is not
    authorized by the copyright owner, its agent, or the law

    6. A statement that the information in your notice is accurate and, under
    penalty of perjury, that you are authorized to act on behalf of the
    copyright owner


    ## Counter-Notification


    If you believe material you posted was removed or disabled by mistake or
    misidentification,

    your counter-notification should include:


    1. Your physical or electronic signature

    2. Identification of the material that was removed or disabled and the
    location where it appeared before removal or disabling

    3. A statement under penalty of perjury that you have a good-faith belief
    the material was removed or disabled as a result of mistake or
    misidentification

    4. Your name, address, telephone number, and email address

    5. A statement that you consent to the jurisdiction of the Federal District
    Court for your judicial district, or if you are outside the United States,
    for any judicial district in which the service provider may be found, and
    that you will accept service of process from the person who submitted the
    original notice or that person's agent


    If we receive a facially valid counter-notification, we may forward it to
    the complaining party.

    Unless the original complainant notifies us that they have filed an action
    seeking a court order,

    we may restore the material in not less than 10 and not more than 14
    business days after receipt

    of the counter-notification.


    ## Repeat Infringer Policy


    We may terminate or restrict the accounts of users who are determined to be
    repeat infringers

    or who repeatedly abuse the Service.


    ## Reporting and Contact


    For copyright notices, takedown requests, malware reports, and other abuse
    issues, use the

    abuse contact listed on the DropShare Legal page and include the full
    DropShare URL, enough

    context to identify the material, and a clear description of the issue.
#This configuration is used to create the initial user when the application is started for the first time.
#Make sure to change at least the password as soon as you log in!
initUser:
  enabled: false
  username: admin
  email: admin@example.com
  password: my-secure-password
  isAdmin: true
  ldapDN: ""
