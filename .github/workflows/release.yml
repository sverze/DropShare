name: Release image

# Publish a container image on a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# Pushes :1.2.0 (pin / rollback), :1.2, and :latest (what auto-update watches).
#
# One-time: after the first successful run, set the package to Public under
# your GitHub profile > Packages, otherwise nobody can pull it.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Registers the ARM emulator. Must come before buildx, which only picks up
      # the platforms available when it starts.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is emulated on an amd64 runner, so this job takes tens of
          # minutes. Verify previews on real ARM hardware before claiming support.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
